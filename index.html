<html lang="uk">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Форма">

<title>Форма — тренування і харчування</title>
<style>
:root{
  --bg:#0d0f12;--card:#171a1f;--card2:#1f232a;--line:#2a2f37;--text:#f2f4f7;--muted:#8b93a1;
  --acc:#4ade80;--acc2:#22c55e;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;--pink:#f472b6;
  --p:#60a5fa;--f:#fbbf24;--c:#f472b6;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:calc(var(--st) + 8px) 0 calc(var(--sb) + 84px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#view{max-width:640px;margin:0 auto;padding:0 14px}
h1{font-size:28px;margin:6px 2px 12px;letter-spacing:-.5px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--card2);border-radius:12px;padding:11px 14px;font-weight:600}
.btn.pri{background:var(--acc2);color:#04140a}
.btn.bad{background:#3a1d1f;color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.chip{display:inline-block;background:var(--card2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chip.ok{background:#12301d;color:var(--acc)}.chip.warn{background:#33290f;color:var(--warn)}
input[type=number],input[type=text],input[type=search],select,textarea{
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
textarea{min-height:84px;resize:vertical}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(var(--sb) + 6px);z-index:20}
#tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:4px 0}
#tabs button.on{color:var(--acc)}
#tabs svg{width:24px;height:24px}
/* nutrition */
.ringwrap{display:flex;align-items:center;gap:16px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.macro{margin-bottom:8px}.macro .row{font-size:13px;margin-bottom:3px}
.meal h3{margin:0;font-size:15px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .kc{font-weight:600;white-space:nowrap}
.add{color:var(--acc);font-weight:600;font-size:14px;padding:6px 0}
.datenav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.datenav button{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px}
/* workout */
.ex{border-left:3px solid transparent}
.ex.ss{border-left-color:var(--blue)}
.setrow{display:grid;grid-template-columns:26px 1fr 14px 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.setrow input{text-align:center;padding:9px 6px}
.setrow .n{color:var(--muted);text-align:center;font-weight:600;padding:7px 0}
.chk{width:46px;height:42px;border-radius:12px;background:var(--card2);font-size:20px;color:var(--muted)}
.chk.on{background:var(--acc2);color:#04140a}
.exhead{display:flex;gap:10px;align-items:flex-start}
.exnum{background:var(--card2);border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:700;font-size:14px}
.hint{font-size:13px;padding:8px 10px;border-radius:10px;margin-top:8px}
.hint.up{background:#12301d;color:var(--acc)}.hint.stall{background:#33290f;color:var(--warn)}
.hint.wu{background:var(--card2);color:var(--muted)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 72px);background:#12301d;border:1px solid #1f5a34;border-radius:16px;
  padding:10px 12px;display:none;align-items:center;gap:10px;z-index:21;max-width:616px;margin:0 auto}
#rest.show{display:flex}
body.resting{padding-bottom:calc(var(--sb) + 160px)}
#rest .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc)}
#rest.done{background:#33290f;border-color:#6b5414}#rest.done .t{color:var(--warn)}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;z-index:31;
  padding:10px 16px calc(var(--sb) + 18px);transform:translateY(105%);transition:transform .25s ease;max-width:640px;margin:0 auto}
#sheet:not(.open){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
#sheet.open{transform:none}#ov.open{display:block}
.grab{width:40px;height:5px;background:var(--line);border-radius:9px;margin:2px auto 12px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text)}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
#toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%) translateY(-120px);background:#262b33;padding:10px 16px;
  border-radius:12px;z-index:40;transition:transform .25s;font-size:14px;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:#33290f;color:var(--warn);margin-bottom:12px}
svg.chart text{fill:var(--muted);font-size:10px}
.stat{background:var(--card2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.prog details summary{cursor:pointer;font-weight:600;list-style:none}
.prog details summary::-webkit-details-marker{display:none}
.ptable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ptable td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:10px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;cursor:pointer}
.cal .c.g{background:#14532d;color:#bbf7d0}.cal .c.y{background:#713f12;color:#fef08a}.cal .c.r{background:#7f1d1d;color:#fecaca}
.cal .c.fut{opacity:.35;cursor:default}.cal .c.today{outline:2px solid var(--text);outline-offset:-2px}
.cal .c .gym{font-size:10px;line-height:1;margin-top:1px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.ai-item{display:grid;grid-template-columns:28px 1fr 78px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ai-item input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc2)}
.ai-item input[type=number]{padding:7px 6px;text-align:center}
</style>
</head>

<div id="rest"><div class="grow"><div class="tiny muted" id="restLbl">Відпочинок</div><div class="t" id="restT">0:00</div></div>

  <button data-tab="gym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Тренування</button>
  <button data-tab="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Відновлення</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18M5 16l5-6 4 3 6-8"/></svg>Прогрес</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Профіль</button>
</nav>

async function initStore() {

  try { [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]); } catch (e) {}
  let id = null;
  if (db && user) { try { id = await user.id(); } catch (e) {} }
  if (!db || !id) { useLocal(); return; }
  Store.mode = "db";
  Store.col = db.collection("data/users/" + id);
  const timer = setTimeout(() => { Store.stale = true; Store.loaded = true; render(); }, 10000);
  Store.col.onSnapshot(snap => {
    let changed = false;
    for (const ch of snap.docChanges()) {
      const key = ch.doc.id;
      if (ch.type === "removed") { if (key in docs) { delete docs[key]; changed = true; } continue; }
      if (Store.q[key] && (Store.q[key].busy || Store.q[key].next)) continue; // наш запис ще летить
      const body = ch.doc.data();
      if (JSON.stringify(docs[key]) !== JSON.stringify(body)) { docs[key] = JSON.parse(JSON.stringify(body)); changed = true; }
    }
    if (!snap.metadata.fromCache) { clearTimeout(timer); Store.stale = false; }

function setProfile(field, raw) {
  const p = profile();
  if (field === "novice") { p.novice = raw; if (raw && !p.noviceStart) p.noviceStart = todayKey(); }
  else if (field === "adaptive") { p.adaptive = !!raw; if (raw) setTimeout(maybeUpdateTDEE, 50); }
  else if (field === "watchPct") { p.watchPct = +raw; p.useWatch = false; }
  else if (field === "trainBonus") p.trainBonus = +raw || 0;
  else if (field === "sex" || field === "goal") p[field] = raw;
  else if (field === "kcalOverride") p.kcalOverride = num(raw) && num(raw) > 800 ? Math.round(num(raw)) : null;
  else if (field === "weight") { const v = num(raw); if (v && v > 25 && v < 300) { p.weight = v; const k = "d-" + todayKey(); const d = JSON.parse(JSON.stringify(day(todayKey()))); d.weight = v; save(k, d); } }
  else { const v = num(raw); if (v) p[field] = v; }
  save("profile", p);
  render();
}

/* ===================== ШІ ЧЕРЕЗ ВЛАСНИЙ КЛЮЧ GEMINI (офлайн-версія) ===================== */
const OWN = !window.claude; // відкрито не в Claude, а з власного сайту / екрана «Додому»
function geminiCfg() { try { return JSON.parse(lsGet("forma-gemini") || "null") || {}; } catch (e) { return {}; } }
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85).split(",")[1];
  } catch (e) {
    return await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(file); });
  }
}
function geminiAdapter(key, model) {
  const call = async (input, opts = {}) => {
    if (!navigator.onLine) throw {code: "offline"};
    const msgs = typeof input === "string" ? [{role: "user", content: input}] : input;
    const contents = msgs.map(m => ({role: m.role === "assistant" ? "model" : "user", parts: [{text: m.content}]}));
    for (const b of opts.images || []) contents[contents.length - 1].parts.push({inline_data: {mime_type: "image/jpeg", data: await shrink(b)}});
    const body = {contents}; if (opts.json) body.generationConfig = {responseMimeType: "application/json"};
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
      {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body), signal: opts.signal});
    if (r.status === 429) throw {code: "rate_limited"};
    if (!r.ok) throw {code: "http", status: r.status};
    const j = await r.json();
    const text = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(p => p.text || "").join("");
    if (opts.onText) opts.onText({text});
    return {text};
  };
  call.json = async (input, opts = {}) => { const {text} = await call(input, Object.assign({}, opts, {json: true}));
    return JSON.parse(text.replace(/^\s*```(?:json)?/i, "").replace(/```\s*$/, "").trim()); };
  call.limits = async () => ({images: true});
  return call;
}
function setupOwnAI() {
  const g = geminiCfg();
  if (OWN && g.key) { sampleFn = geminiAdapter(g.key, g.model || "gemini-2.5-flash"); sampleImages = true; }
  else if (OWN) { sampleFn = null; sampleImages = false; }
}
async function testGemini() {
  const g = geminiCfg(); if (!g.key) return toast("Спершу встав ключ");
  if (!navigator.onLine) return toast("Немає інтернету");
  try { await geminiAdapter(g.key, g.model || "gemini-2.5-flash")("Відповідай одним словом: працює?"); toast("ШІ працює ✓"); }
  catch (e) { toast(e && e.status === 400 ? "Ключ або модель не підходять" : e && e.status === 404 ? "Модель не знайдено — перевір назву" : e && e.code === "rate_limited" ? "Ліміт запитів — спробуй пізніше" : "Не вдалося з’єднатися з Gemini"); }
}
